name: capture
on:
  workflow_dispatch:
  push:
    paths: ["capture/request.json"]
permissions:
  contents: write
concurrency: capture
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/capture.mjs 2>&1 | tee capture/log.txt
      - name: Commit capture
        run: |
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add capture public
          git commit -m "Captura do site Framer (run ${{ github.run_number }})" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main
